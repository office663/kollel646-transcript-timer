name: kollel646-drain
on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: kollel646-drain
  cancel-in-progress: false
jobs:
  drain:
    if: ${{ vars.KOLLEL646_DRAIN_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Drain one eligible 646 transcript job
        env:
          DRAIN_URL: ${{ secrets.KOLLEL646_DRAIN_URL }}
          DRAIN_TOKEN: ${{ secrets.KOLLEL646_DRAIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DRAIN_URL" || -z "$DRAIN_TOKEN" ]]; then
            echo 'Timer configuration missing; skipped.'
            exit 0
          fi
          set +e
          code=$(printf 'Authorization: Bearer %s\n' "$DRAIN_TOKEN" | curl --silent --show-error --proto '=https' --connect-timeout 20 --max-time 240 --request POST --header @- --output /dev/null --write-out '%{http_code}' "$DRAIN_URL")
          rc=$?
          set -e
          echo "http=${code} curl_exit=${rc}"
          case "$code" in
            200|202|409|429) exit 0 ;;
            *) exit 1 ;;
          esac
